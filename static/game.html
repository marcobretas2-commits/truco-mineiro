<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truco Mineiro Online</title>
<link rel="stylesheet" href="/static/style.css">

<style>
/* ==============================
   ÃREA DO JOGO
   ============================== */

.game-body {
  min-height: 100vh;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 12px 20px;
}

.brand {
  font-size: 24px;
  font-weight: 800;
}

.room-info {
  font-size: 14px;
}

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 15px auto;
  flex-wrap: wrap;
}

.score-box {
  min-width: 150px;
  padding: 12px 20px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
}

.score-box .score {
  display: block;
  font-size: 32px;
  margin-top: 4px;
}

.game-area {
  width: min(1100px, 96%);
  margin: auto;
}

.table-area {
  position: relative;
  min-height: 470px;
  border-radius: 25px;
  padding: 20px;
  margin-top: 15px;
}

.seat {
  position: absolute;
  width: 180px;
  min-height: 80px;
  padding: 10px;
  border-radius: 15px;
  text-align: center;
  transition: .2s;
}

.seat.turn {
  transform: scale(1.06);
  box-shadow: 0 0 20px rgba(255,215,0,.8);
}

.seat-0 {
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
}

.seat-1 {
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.seat-2 {
  left: 50%;
  top: 15px;
  transform: translateX(-50%);
}

.seat-3 {
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.player-name {
  font-weight: 800;
}

.player-team {
  font-size: 12px;
  opacity: .8;
}

.hand-count {
  margin-top: 5px;
  font-size: 13px;
}

.table-cards {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  min-width: 300px;
  min-height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.played {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.played > span {
  font-size: 11px;
  font-weight: 700;
}

.my-hand {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 10px;
  min-height: 145px;
  margin: 10px auto;
  flex-wrap: wrap;
}

.card {
  width: 78px;
  height: 112px;
  background: white;
  color: #111;
  border-radius: 10px;
  border: 2px solid #222;
  box-shadow: 0 5px 12px rgba(0,0,0,.3);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px;
  box-sizing: border-box;
  font-weight: 800;
  user-select: none;
}

.card.playable {
  cursor: pointer;
  transition: .18s;
}

.card.playable:hover {
  transform: translateY(-15px) rotate(-1deg);
}

.card .rank {
  font-size: 22px;
}

.card .suit {
  font-size: 28px;
  text-align: center;
}

.card.back {
  background: repeating-linear-gradient(
    45deg,
    #222,
    #222 7px,
    #555 7px,
    #555 14px
  );
  border-color: #111;
}

.actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px auto;
}

.actions button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 800;
  font-size: 14px;
}

.actions button:hover {
  transform: translateY(-1px);
}

.actions .danger {
  background: #b51d2a;
  color: white;
}

.actions .success {
  background: #168a45;
  color: white;
}

.actions .mao11 {
  background: #d98b00;
  color: white;
}

.chat-panel {
  width: min(760px, 94%);
  margin: 10px auto;
  padding: 12px;
  border-radius: 16px;
  background: rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.12);
}

.chat-title {
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 8px;
}

.chat-messages {
  height: 110px;
  overflow-y: auto;
  padding: 8px;
  border-radius: 10px;
  background: rgba(0,0,0,.22);
  margin-bottom: 8px;
}

.chat-empty {
  opacity: .55;
  font-size: 12px;
}

.chat-message {
  margin-bottom: 5px;
  font-size: 13px;
  word-break: break-word;
}

.chat-message strong {
  color: #ffd54a;
}

.chat-input-row {
  display: flex;
  gap: 7px;
}

.chat-input-row input {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 9px;
  padding: 10px;
  font-size: 14px;
}

.chat-input-row button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 800;
}

.signal-panel {
  width: min(760px, 94%);
  margin: 10px auto;
  padding: 10px 12px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.30);
  text-align: center;
}

.signal-title {
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 8px;
}

.signal-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

.signal-buttons button {
  border: 0;
  border-radius: 10px;
  padding: 8px 11px;
  cursor: pointer;
  font-weight: 800;
  background: rgba(255,255,255,.12);
  color: white;
}

.signal-buttons button:hover {
  transform: translateY(-1px);
  background: rgba(255,255,255,.22);
}

.signal-status {
  margin-top: 7px;
  font-size: 12px;
  opacity: .75;
  min-height: 16px;
}

.partner-signal {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 16px 24px;
  border-radius: 18px;
  background: rgba(20,20,20,.96);
  border: 2px solid rgba(255,255,255,.25);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  text-align: center;
  animation: signalPop .25s ease-out;
}

.partner-signal-name {
  font-size: 13px;
  opacity: .75;
  margin-bottom: 4px;
}

.partner-signal-icon {
  font-size: 42px;
}

.partner-signal-text {
  font-size: 20px;
  font-weight: 900;
}

@keyframes signalPop {
  from {
    opacity: 0;
    transform: translateX(-50%) scale(.7);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
}

.message {
  min-height: 45px;
  margin: 10px auto;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  font-weight: 800;
}

.tricks {
  text-align: center;
  font-size: 14px;
  margin: 8px;
}

/* ==============================
   MÃƒO DE 11
   ============================== */

.mao11-panel {
  width: min(600px, 94%);
  margin: 12px auto;
  padding: 18px;
  border-radius: 18px;
  text-align: center;
  border: 2px solid #d98b00;
  background: rgba(217,139,0,.12);
}

.mao11-title {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 8px;
}

.mao11-text {
  margin-bottom: 12px;
}

.mao11-waiting {
  font-size: 14px;
  opacity: .85;
}

/* ==============================
   ANIMAÃ‡ÃƒO NOVA MÃƒO
   ============================== */

.deal-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.78);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.deal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.deal-box {
  text-align: center;
  color: white;
}

.deal-title {
  font-size: 30px;
  font-weight: 900;
  margin-bottom: 20px;
}

.deck-animation {
  width: 75px;
  height: 105px;
  margin: 0 auto 20px;
  position: relative;
}

.deck-card {
  position: absolute;
  inset: 0;
  width: 75px;
  height: 105px;
  border-radius: 10px;
  border: 2px solid white;
  background: repeating-linear-gradient(
    45deg,
    #222,
    #222 7px,
    #555 7px,
    #555 14px
  );
  box-shadow: 0 8px 15px rgba(0,0,0,.5);
}

.deck-card:nth-child(1) {
  transform: rotate(-8deg);
  animation: shuffle1 .8s infinite alternate;
}

.deck-card:nth-child(2) {
  transform: rotate(0deg);
  animation: shuffle2 .8s .1s infinite alternate;
}

.deck-card:nth-child(3) {
  transform: rotate(8deg);
  animation: shuffle3 .8s .2s infinite alternate;
}

@keyframes shuffle1 {
  from { transform: translateX(-12px) rotate(-12deg); }
  to   { transform: translateX(12px) rotate(12deg); }
}

@keyframes shuffle2 {
  from { transform: translateY(-8px) rotate(-4deg); }
  to   { transform: translateY(8px) rotate(4deg); }
}

@keyframes shuffle3 {
  from { transform: translateX(12px) rotate(12deg); }
  to   { transform: translateX(-12px) rotate(-12deg); }
}

.deal-subtitle {
  font-size: 16px;
  opacity: .85;
}

.hidden {
  display: none !important;
}

@media(max-width:700px){
  .table-area {
    min-height: 430px;
  }

  .seat {
    width: 125px;
    font-size: 12px;
  }

  .seat-1 {
    right: 2px;
  }

  .seat-3 {
    left: 2px;
  }

  .card {
    width: 65px;
    height: 95px;
  }
}

/* ===== CARTAS DO TRUCO ===== */
.card:not(.back) {
  background: #ffffff !important;
  color: #111111 !important;
  border: 2px solid #222222 !important;
  box-shadow: 0 6px 15px rgba(0,0,0,.35) !important;
}

.card:not(.back) .rank {
  color: #111111 !important;
}

.card:not(.back) .suit {
  color: #111111 !important;
}

.card.back {
  background: repeating-linear-gradient(
    45deg,
    #222,
    #222 7px,
    #555 7px,
    #555 14px
  ) !important;
  color: #fff !important;
}


<style id="signal-avatar-gestures">

/* Movimento geral do avatar durante um sinal */
.seat.signal-gesture-manilha .human-avatar,
.seat.signal-gesture-boa .human-avatar,
.seat.signal-gesture-ruim .human-avatar,
.seat.signal-gesture-carta_alta .human-avatar,
.seat.signal-gesture-carta_media .human-avatar,
.seat.signal-gesture-carta_baixa .human-avatar,
.seat.signal-gesture-truco .human-avatar,
.seat.signal-gesture-segura .human-avatar {
    animation: signalAvatarBody .75s ease-in-out;
}

/* MANILHA - m?o pr?xima ao rosto */
.seat.signal-gesture-manilha .human-arm {
    animation: signalManilha .85s ease-in-out;
    transform-origin: left center;
}

/* BOA - bra?o levantando */
.seat.signal-gesture-boa .human-arm {
    animation: signalBoa .85s ease-in-out;
    transform-origin: left center;
}

/* RUIM - gesto para baixo */
.seat.signal-gesture-ruim .human-arm {
    animation: signalRuim .85s ease-in-out;
    transform-origin: left center;
}

/* CARTA ALTA - bra?o levantado */
.seat.signal-gesture-carta_alta .human-arm {
    animation: signalAlta .85s ease-in-out;
    transform-origin: left center;
}

/* CARTA MEDIA - m?o no meio */
.seat.signal-gesture-carta_media .human-arm {
    animation: signalMedia .85s ease-in-out;
    transform-origin: left center;
}

/* CARTA BAIXA - aponta para baixo */
.seat.signal-gesture-carta_baixa .human-arm {
    animation: signalBaixa .85s ease-in-out;
    transform-origin: left center;
}

/* TRUCO - bate a m?o na mesa */
.seat.signal-gesture-truco .human-arm {
    animation: signalTruco .75s ease-in-out;
    transform-origin: left center;
}

/* SEGURA - m?o levantada */
.seat.signal-gesture-segura .human-arm {
    animation: signalSegura .85s ease-in-out;
    transform-origin: left center;
}

@keyframes signalAvatarBody {
    0% {
        transform: translateY(0) scale(1);
    }
    35% {
        transform: translateY(-4px) scale(1.03);
    }
    70% {
        transform: translateY(1px) scale(.99);
    }
    100% {
        transform: translateY(0) scale(1);
    }
}

@keyframes signalManilha {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(-48deg) translateY(-5px);
    }
    65% {
        transform: rotate(-35deg) translateY(-2px);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalBoa {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(-72deg) translateX(-4px);
    }
    65% {
        transform: rotate(-58deg);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalRuim {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(42deg) translateY(9px);
    }
    65% {
        transform: rotate(32deg) translateY(5px);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalAlta {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(-82deg) translateX(-6px);
    }
    65% {
        transform: rotate(-68deg);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalMedia {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(-8deg) translateX(16px);
    }
    65% {
        transform: rotate(-2deg) translateX(12px);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalBaixa {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(62deg) translateY(12px);
    }
    65% {
        transform: rotate(48deg) translateY(8px);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalTruco {
    0% {
        transform: rotate(14deg);
    }
    25% {
        transform: rotate(-12deg) translateX(5px);
    }
    55% {
        transform: rotate(35deg) translateX(20px) translateY(16px);
    }
    72% {
        transform: rotate(45deg) translateX(22px) translateY(20px);
    }
    100% {
        transform: rotate(14deg);
    }
}

@keyframes signalSegura {
    0% {
        transform: rotate(14deg);
    }
    35% {
        transform: rotate(-55deg) translateX(-3px);
    }
    65% {
        transform: rotate(-48deg);
    }
    100% {
        transform: rotate(14deg);
    }
}

</style>

</style>

<style id="human-players-style">

.table-area {
    position: relative;
    min-height: 620px;
    overflow: hidden;
}

.seat {
    position: absolute;
    z-index: 10;
    width: 135px;
    min-height: 105px;
    text-align: center;
    transition: transform .35s ease, filter .35s ease;
}

.seat-0 {
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
}

.seat-1 {
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
}

.seat-2 {
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
}

.seat-3 {
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
}

.human-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.human-avatar {
    position: relative;
    width: 82px;
    height: 92px;
    margin: auto;
}

.human-head {
    position: absolute;
    width: 48px;
    height: 54px;
    left: 17px;
    top: 2px;
    border-radius: 48% 48% 45% 45%;
    background: linear-gradient(145deg, #f2c7a5, #c98762);
    box-shadow: inset -5px -4px 0 rgba(0,0,0,.08);
}

.human-hair {
    position: absolute;
    width: 52px;
    height: 30px;
    left: 15px;
    top: 0;
    border-radius: 50% 50% 25% 25%;
    background: #33251e;
}

.human-eye {
    position: absolute;
    width: 5px;
    height: 5px;
    top: 27px;
    border-radius: 50%;
    background: #222;
}

.human-eye.left {
    left: 28px;
}

.human-eye.right {
    right: 28px;
}

.human-body {
    position: absolute;
    width: 78px;
    height: 46px;
    left: 2px;
    bottom: 0;
    border-radius: 42px 42px 12px 12px;
    background: linear-gradient(145deg, #315b7d, #172d42);
}

.human-arm {
    position: absolute;
    width: 52px;
    height: 13px;
    top: 61px;
    left: 16px;
    border-radius: 20px;
    background: #e0aa87;
    transform-origin: left center;
    transition: transform .4s ease;
}

.seat.turn .human-arm {
    animation: playerMove .8s ease-in-out infinite alternate;
}

.seat.turn .human-avatar {
    animation: playerBreathe 1.4s ease-in-out infinite;
}

@keyframes playerMove {
    from { transform: rotate(-8deg) translateX(0); }
    to   { transform: rotate(12deg) translateX(12px); }
}

@keyframes playerBreathe {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
}

.player-name {
    font-weight: 800;
    font-size: 15px;
}

.player-team {
    font-size: 12px;
    opacity: .85;
}

.hand-count {
    font-size: 11px;
    opacity: .8;
}

.turn .player-name::after {
    content: "  SUA VEZ";
    display: inline-block;
    margin-left: 5px;
    padding: 3px 6px;
    border-radius: 8px;
    background: #ffd54a;
    color: #222;
    font-size: 9px;
    animation: turnPulse 1s infinite;
}

<script>
const params = new URLSearchParams(location.search);
const code = location.pathname.split("/").filter(Boolean).pop() || "";

const name =
  params.get("name") ||
  localStorage.getItem("truco_name") ||
  ("Jogador " + Math.floor(Math.random() * 999));

localStorage.setItem("truco_name", name);

let mySeat = null;
let ws = null;
let state = null;
let previousState = null;
let firstState = true;
let animationTimer = null;

document.getElementById("roomCode").textContent = code.toUpperCase();

/* ==============================
   CONEXÃƒO
   ============================== */

function connect(){

  const protocol =
    location.protocol === "https:" ? "wss" : "ws";

  ws = new WebSocket(
    `${protocol}://${location.host}/ws/${code}`
  );

  ws.onopen = () => {

    ws.send(JSON.stringify({
      name: name
    }));

  };

  ws.onmessage = e => {

    const data = JSON.parse(e.data);

    if(data.type === "joined"){

      mySeat = data.seat;

      if(params.get("create") === "1"){

        setTimeout(() => {
          sendAction("start");
        }, 500);

      }

    }

    if(data.type === "state"){

      previousState = state;

      const novoEstado = data.state;

      // Detecta pedido de Truco ou aumento confirmado.
      if(novoEstado){

        const novoValor =
          Number(
            novoEstado.pending_raise ||
            novoEstado.hand_value ||
            1
          );

        const valorAnterior =
          Number(
            previousState?.pending_raise ||
            previousState?.hand_value ||
            1
          );

        // Novo pedido de Truco.
        if(
          novoEstado.stage === "raise" &&
          previousState?.stage !== "raise"
        ){
          mostrarTrucoGrande(novoValor);
        }

        // Aumento confirmado: 3 -> 6 -> 9 -> 12.
        else if(
          novoValor > valorAnterior &&
          [3, 6, 9, 12].includes(novoValor)
        ){
          mostrarTrucoGrande(novoValor);
        }

      }

      state = novoEstado;

      verificarNovaMao();

      render();

    }

    if(data.type === "chat"){
    mostrarMensagemChat(data);
  }

  if(data.type === "partner_signal"){
      mostrarSinalParceiro(data);
    }

    if(data.type === "signal_sent"){

      const dados = signalLabels[data.signal];

      if(dados){

        const status =
          document.getElementById("signalStatus");

        if(status){
          status.textContent =
            dados.icon + " Sinal enviado ao parceiro.";
        }

      }

    }

    if(data.type === "error"){

      mostrarMensagem(data.message);

    }

  };

  ws.onclose = () => {

    document.getElementById("message").textContent =
      "Conexão perdida. Reconectando...";

    if(state && code){
      setTimeout(() => {
        if(!ws || ws.readyState === WebSocket.CLOSED){
          connect();
        }
      }, 1200);
    }

  };

  ws.onerror = () => {

    document.getElementById("message").textContent =
      "Erro na conexÃ£o com o servidor.";

  };

}

/* ==============================
   ENVIO DE AÃ‡Ã•ES
   ============================== */


let trucoAudioContext = null;

function desbloquearAudioTruco(){

  try{

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){
      return;
    }

    if(!trucoAudioContext){
      trucoAudioContext = new AudioCtx();
    }

    if(trucoAudioContext.state === "suspended"){
      trucoAudioContext.resume().catch(() => {});
    }

  }catch(e){

    console.log("Audio Truco indispon?vel:", e);

  }

}

function tocarSomTruco(valor){

  try{

    desbloquearAudioTruco();

    if(!trucoAudioContext){
      return;
    }

    if(trucoAudioContext.state === "suspended"){
      return;
    }

    const agora = trucoAudioContext.currentTime;

    const ganho = trucoAudioContext.createGain();
    const oscilador = trucoAudioContext.createOscillator();

    const frequencias = {
      3: 440,
      6: 520,
      9: 620,
      12: 740
    };

    oscilador.type = "square";
    oscilador.frequency.setValueAtTime(
      frequencias[Number(valor)] || 440,
      agora
    );

    ganho.gain.setValueAtTime(0.0001, agora);
    ganho.gain.exponentialRampToValueAtTime(0.18, agora + 0.015);
    ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.22);

    oscilador.connect(ganho);
    ganho.connect(trucoAudioContext.destination);

    oscilador.start(agora);
    oscilador.stop(agora + 0.23);

  }catch(e){

    console.log("Erro no som do Truco:", e);

  }

}

// Desbloqueia o ?udio atrav?s da primeira intera??o real do jogador.
document.addEventListener(
  "pointerdown",
  desbloquearAudioTruco,
  { once: true }
);

document.addEventListener(
  "keydown",
  desbloquearAudioTruco,
  { once: true }
);

function mostrarTrucoGrande(valor){
  const box = document.getElementById("trucoAnnouncement");
  const texto = document.getElementById("trucoAnnouncementText");

function suitSymbol(s){

  const symbols = {
    paus: "&clubs;",
    copas: "&hearts;",
    espadas: "&spades;",
    ouros: "&diams;"
  };

  return symbols[s] || s;

}

function cardHTML(card, index, playable = false){

  if(!card){
    return "";
  }

  if(card.hidden){
    return `
      <div class="card back"></div>
    `;
  }

  const suit = suitSymbol(card.suit);
  const suitClass = card.suit || "";

  let destaque = "";

  if(card.rank === "4" && card.suit === "paus"){
    destaque = "ZAP";
  }
  else if(card.rank === "7" && card.suit === "copas"){
    destaque = "MANILHA";
  }
  else if(card.rank === "A" && card.suit === "espadas"){
    destaque = "ESPADILHA";
  }
  else if(card.rank === "7" && card.suit === "ouros"){
    destaque = "MANILHA";
  }

  const etiqueta = destaque
    ? `<span class="mini-strength manilha">${destaque}</span>`
    : `<span class="mini-strength">For?a ${card.strength}</span>`;

  return `
    <div
      class="card ${suitClass} ${playable ? "playable" : ""}"
      ${playable ? `onclick="jogarCarta(${index})"` : ""}
    >
      <div class="card-top">
        <span class="rank">${card.rank}</span>
        ${etiqueta}
      </div>

      <div class="suit">${suit}</div>

      <div class="rank bottom">${card.rank}</div>
    </div>
  `;
}

function aplicarCorMesa(cor){

  const mesa = document.querySelector(".table-area");

  if(!mesa){
    return;
  }

  const cores = {
    verde: "#176b3a",
    verde_escuro: "#0d4528",
    azul: "#164b73",
    vermelho: "#6b2020",
    roxo: "#4b286b",
    preto: "#202020"
  };

  mesa.style.setProperty(
    "background",
    cores[cor] || cores.verde,
    "important"
  );

  mesa.style.setProperty(
    "background-image",
    "none",
    "important"
  );
}

function mudarCorMesa(cor){

  aplicarCorMesa(cor);

  try{
    localStorage.setItem(
      "truco_cor_mesa",
      cor
    );
  }catch(e){
    console.log("N?o foi poss?vel salvar a cor da mesa:", e);
  }
}

function carregarCorMesa(){

  let cor = "verde";

  try{
    cor =
      localStorage.getItem("truco_cor_mesa") ||
      "verde";
  }catch(e){}

  const seletor =
    document.getElementById("tableColorSelector");

    seletor.value = cor;
  }
}

  "DOMContentLoaded",
  carregarCorMesa
);

function mostrarMensagemChat(data){

  const box = document.getElementById("chatMessages");

  if(!box){
    return;
  }

  const vazio = box.querySelector(".chat-empty");

  if(vazio){
    vazio.remove();
  }

  const item = document.createElement("div");
  item.className = "chat-message";

  const nome = document.createElement("strong");
  nome.textContent = (data.from_name || "Jogador") + ": ";

  const texto = document.createElement("span");
  texto.textContent = data.message || "";

  item.appendChild(nome);
  item.appendChild(texto);

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;
}


function iniciarMicrofone(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Seu navegador n?o possui reconhecimento de voz.");
    return;
  }

  if(window.reconhecimentoVozAtivo){
    return;
  }

  const reconhecimento = new SpeechRecognition();

  reconhecimento.lang = "pt-BR";
  reconhecimento.continuous = false;
  reconhecimento.interimResults = false;
  reconhecimento.maxAlternatives = 1;

  window.reconhecimentoVozAtivo = true;

  const botao =
    document.getElementById("microphoneButton");

  if(botao){
    botao.innerHTML = "&#128308; OUVINDO...";
  }

  reconhecimento.onresult = function(event){

    const texto =
      event.results &&
      event.results[0] &&
      event.results[0][0]
        ? event.results[0][0].transcript.trim()
        : "";

    const input =
      document.getElementById("chatInput");

    if(input && texto){
      input.value = texto;
      input.focus();
    }
  };

  reconhecimento.onerror = function(event){

    console.log(
      "Erro no reconhecimento de voz:",
      event.error
    );
  };

  reconhecimento.onend = function(){

    window.reconhecimentoVozAtivo = false;

    const botao =
      document.getElementById("microphoneButton");

    if(botao){
      botao.innerHTML = "&#127908; FALAR";
    }
  };

  try{
    reconhecimento.start();
  }catch(error){

    window.reconhecimentoVozAtivo = false;

    if(botao){
      botao.innerHTML = "&#127908; FALAR";
    }

    console.log(
      "Microfone indispon?vel:",
      error
    );
  }
}

function enviarChat(){

  if(!ws || ws.readyState !== WebSocket.OPEN){
    return;
  }

  const input = document.getElementById("chatInput");

  if(!input){
    return;
  }

  const texto = input.value.trim();

  if(!texto){
    return;
  }

  ws.send(JSON.stringify({
    action: "chat",
    message: texto
  }));

  input.value = "";
  input.focus();
}

document.addEventListener("keydown", function(event){

  if(
    event.target &&
    event.target.id === "chatInput" &&
    event.key === "Enter"
  ){
    event.preventDefault();
    enviarChat();
  }

});
</script>
